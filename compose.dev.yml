name: maternalmind-localdev

services:
  website:
    image: localhost/maternalmind-website-dev:latest
    build:
      context: ./Maternal Mind Website
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -lc "rm -rf dist build .vite .turbo .next/cache &&
      npm install --legacy-peer-deps &&
      npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - ./Maternal Mind Website:/app
      - website_node_modules:/app/node_modules
      - website_npm_cache:/root/.npm
      - website_tmp_cache:/tmp/localdev
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgres://postgres:postgres@db:5432/maternalmind
      SESSION_SECRET: local-dev-change-me
      ALLOWED_ORIGIN: http://localhost:5000,http://localhost:5173
      DB_POOL_MAX: "20"
      LOG_LEVEL: debug
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      WATCHPACK_POLLING: "true"
      VITE_HMR_HOST: localhost
      TMPDIR: /tmp/localdev
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.localdev.project: maternalmind
      com.localdev.managed: "true"

  admin:
    image: localhost/maternalmind-admin-dev:latest
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -lc "rm -rf dist build .vite .turbo .next/cache &&
      npm install &&
      npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_npm_cache:/root/.npm
      - admin_tmp_cache:/tmp/localdev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      WATCHPACK_POLLING: "true"
      VITE_HMR_HOST: localhost
      ADMIN_API_PROXY_TARGET: http://website:5000
      TMPDIR: /tmp/localdev
    depends_on:
      - website
    labels:
      com.localdev.project: maternalmind
      com.localdev.managed: "true"

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maternalmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maternalmind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      com.localdev.project: maternalmind
      com.localdev.managed: "true"

volumes:
  website_node_modules:
    labels:
      com.localdev.cache: "true"
  website_npm_cache:
    labels:
      com.localdev.cache: "true"
  website_tmp_cache:
    labels:
      com.localdev.ephemeral: "true"
  admin_node_modules:
    labels:
      com.localdev.cache: "true"
  admin_npm_cache:
    labels:
      com.localdev.cache: "true"
  admin_tmp_cache:
    labels:
      com.localdev.ephemeral: "true"
  postgres_data:
    labels:
      com.localdev.persistent: "true"
