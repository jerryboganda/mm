services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgres://maternal_mind:32a87fd0fc74c9b95c999b5a44623e207dfa3843@platform-postgres:5432/maternal_mind}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - DB_POOL_MAX=20
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://maternalmind.com.pk}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PLATFORM_S3_ENDPOINT=${PLATFORM_S3_ENDPOINT:-http://platform-minio:9000}
      - PLATFORM_S3_BUCKET=${PLATFORM_S3_BUCKET:-maternal-mind}
      - PLATFORM_S3_ACCESS_KEY=${PLATFORM_S3_ACCESS_KEY:-maternal-mind}
      - PLATFORM_S3_SECRET_KEY=${PLATFORM_S3_SECRET_KEY:-6cabf543b20b58043d9815b30df2e031ab1c16b2}
      - PLATFORM_REDIS_URL=${PLATFORM_REDIS_URL:-redis://maternal_mind:718f7879158997808038b447f087a1eccc772273@platform-redis:6379/2}
      - PLATFORM_SOKETI_HOST=${PLATFORM_SOKETI_HOST:-platform-soketi}
      - PLATFORM_SOKETI_PORT=${PLATFORM_SOKETI_PORT:-6001}
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST:-}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT:-}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER:-}
      - BREVO_SMTP_PASS=${BREVO_SMTP_PASS:-}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-}
      - BREVO_FROM_NAME=${BREVO_FROM_NAME:-}
      # Self-hosted Expo OTA: where the server reads the code-signing private key.
      - CODE_SIGNING_PRIVATE_KEY_PATH=/app/secrets/code-signing-private-key.pem
      - CODE_SIGNING_KEY_ID=${CODE_SIGNING_KEY_ID:-main}
    volumes:
      # Persist user/admin uploads (content images, payment proofs) directly on host.
      # Host bind-mount guarantees files survive all docker prune/down/volume commands.
      - ./uploads:/app/uploads
      # Published OTA update bundles, dropped here by the GitHub Actions publish
      # pipeline (rsync). A host bind-mount so CI can write to it directly.
      - ./updates:/app/updates
      # Code-signing private key (read-only). Lives only on the host, never baked
      # into the image. Create ./secrets/code-signing-private-key.pem on the VPS.
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    networks:
      - default
      - npm
      - platform
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm:
    name: nginx-proxy-manager_default
    external: true
  platform:
    external: true
