        - generic [ref=e97]:
          - generic [ref=e98]:
            - heading "1. Information We Collect" [level=2] [ref=e99]
            - paragraph [ref=e100]: We collect information you provide directly (name, email, account details) and usage data (study progress, quiz results, app interactions). We do not collect clinical patient data or sensitive medical records.
          - generic [ref=e101]:
            - heading "2. How We Use Your Information" [level=2] [ref=e102]
            - paragraph [ref=e103]: Your data is used to provide the service (delivering content, tracking progress, managing subscriptions), improve the platform, communicate important updates, and provide customer support. We do not sell your personal information.
          - generic [ref=e104]:
            - heading "3. Data Security" [level=2] [ref=e105]
            - paragraph [ref=e106]: We implement industry-standard security measures to protect your data, including encryption in transit and at rest, secure authentication, and regular security assessments. However, no method of transmission over the internet is completely secure.
          - generic [ref=e107]:
            - heading "4. Data Retention" [level=2] [ref=e108]
            - paragraph [ref=e109]: We retain your data for as long as your account is active. If you delete your account, we will remove your personal data within 30 days, except where retention is required by law.
          - generic [ref=e110]:
            - heading "5. Third-Party Services" [level=2] [ref=e111]
            - paragraph [ref=e112]: We use essential third-party services for payment processing (App Store/Google Play), analytics (aggregated, anonymised), and infrastructure. These providers are bound by their own privacy policies and data protection agreements.
          - generic [ref=e113]:
            - heading "6. Your Rights" [level=2] [ref=e114]
            - paragraph [ref=e115]: You have the right to access, correct, or delete your personal data. You may request a copy of your data or ask us to stop processing it. Contact us at privacy@maternalmind.app to exercise these rights.
          - generic [ref=e116]:
            - heading "7. Cookies and Tracking" [level=2] [ref=e117]
            - paragraph [ref=e118]: Our website uses essential cookies for functionality. We may use analytics tools to understand how the platform is used. You can manage cookie preferences through your browser settings.
          - generic [ref=e119]:
            - heading "8. Contact" [level=2] [ref=e120]
            - paragraph [ref=e121]: For privacy-related inquiries, contact our Data Protection team at privacy@maternalmind.app.
