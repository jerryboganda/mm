name: Android Release Build

# Builds a signed Android App Bundle (.aab) entirely in GitHub Actions — no EAS.
# Use this for the store builds that OTA cannot deliver: the one-time build that
# embeds the expo-updates engine, and any later build that changes native code
# (new native dependency, SDK bump, app.json native config, runtime-version change).
#
# Manual-trigger only. Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Optional (to auto-submit to Google Play internal track):
#   PLAY_SERVICE_ACCOUNT_JSON Google Play service-account JSON
#
# NOTE: This is a solid starting point; validate the produced AAB installs &
# is accepted by Play before relying on it in your release flow.

on:
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: "Also upload the AAB to Google Play (internal track)?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild (generate android/)
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Verify Android optimization config
        run: |
          set -euo pipefail
          echo "::group::gradle.properties (optimization flags)"
          grep -E "enableMinifyInReleaseBuilds|enableShrinkResourcesInReleaseBuilds|optimizedResourceShrinking|edgeToEdgeEnabled" android/gradle.properties || true
          echo "::endgroup::"
          grep -q "android.enableMinifyInReleaseBuilds=true" android/gradle.properties
          grep -q "android.enableShrinkResourcesInReleaseBuilds=true" android/gradle.properties
          grep -q "android.r8.optimizedResourceShrinking=true" android/gradle.properties
          echo "::group::ML Kit scanner activity manifest override"
          grep -A1 -B1 "GmsBarcodeScanningDelegateActivity" android/app/src/main/AndroidManifest.xml || true
          echo "::endgroup::"
          grep -q "GmsBarcodeScanningDelegateActivity" android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="fullUser"' android/app/src/main/AndroidManifest.xml

      - name: Restore keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
          # Ensure gradle.properties ends with a newline before appending
          # (Expo prebuild emits no trailing newline; without this, the first
          # appended property gets glued onto the last generated one).
          [ -n "$(tail -c 1 android/gradle.properties)" ] && echo >> android/gradle.properties || true
          {
            echo "MM_UPLOAD_STORE_FILE=upload.keystore"
            echo "MM_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "MM_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MM_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties
          # CI runner tuning: bigger Gradle heap + parallel workers so the
          # 4-ABI C++ builds + R8 finish well inside the 6h job cap.
          echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC" >> android/gradle.properties
          echo "org.gradle.workers.max=4" >> android/gradle.properties

      - name: Inject release signing config
        run: node scripts/ci/patch-android-signing.mjs

      - name: Build release AAB
        timeout-minutes: 240
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify merged manifest and R8 output
        run: |
          set -euo pipefail
          MERGED_MANIFEST=$(find android/app/build/intermediates/merged_manifests -name AndroidManifest.xml -path "*release*" | head -n 1)
          echo "Merged manifest: $MERGED_MANIFEST"
          echo "::group::GmsBarcodeScanningDelegateActivity in merged manifest"
          grep -A2 "GmsBarcodeScanningDelegateActivity" "$MERGED_MANIFEST"
          echo "::endgroup::"
          if grep "GmsBarcodeScanningDelegateActivity" "$MERGED_MANIFEST" | grep -q 'PORTRAIT\|portrait'; then
            echo "::error::GmsBarcodeScanningDelegateActivity is still orientation-locked"
            exit 1
          fi
          if [ ! -f android/app/build/outputs/mapping/release/mapping.txt ]; then
            echo "::error::R8 mapping.txt missing — minification did not run"
            exit 1
          fi
          echo "mapping.txt size: $(wc -c < android/app/build/outputs/mapping/release/mapping.txt) bytes"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: maternal-mind-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Submit to Google Play (internal)
        # NB: the `secrets` context cannot be used in `if:`; the action below
        # receives the service account via `with:`. Ensure PLAY_SERVICE_ACCOUNT_JSON
        # is set before enabling submit_to_play.
        if: ${{ inputs.submit_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.maternalmind.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
