name: Deploy to Hostinger (Single Slot)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          (cd admin && npm install --no-audit --no-fund)
          (cd "Maternal Mind Website" && npm install --no-audit --no-fund)

      - name: Build Unified Single-Slot App
        run: npm run build

      - name: Deploy Built Artifacts via SCP to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST || '145.79.25.8' }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER || 'u776151780' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          target: "domains/maternalmind.com.pk/public_html"
          rm: false
          source: "server_dist,website_dist,admin_dist,web_dist,uploads,scripts/maternal_mind_mysql.sql,package.json,package-lock.json,app.json,server/templates"

      - name: Trigger Hostinger Restart & MySQL Import via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || '145.79.25.8' }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_USER || 'u776151780' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "Connected to Hostinger via GitHub Actions!"
            cd ~/domains/maternalmind.com.pk/public_html || cd ~/public_html || cd ~

            # Import MySQL database dump into Hostinger MySQL
            if [ -f "scripts/maternal_mind_mysql.sql" ]; then
              echo "Importing production database dump into Hostinger MySQL (u776151780_maternalmind)..."
              mysql -u u776151780_mmuser -p'y!&rxCgt*4H' u776151780_maternalmind < scripts/maternal_mind_mysql.sql 2>/dev/null || true
            fi

            # Lightweight production install for external modules
            npm ci --omit=dev --no-audit --no-fund || npm install --production --no-audit --no-fund

            # Trigger Passenger/Hostinger process restart
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Hostinger single-slot deployment successfully activated!"
