name: Manual Deploy to Hostinger

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - website
          - app_and_admin

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          (cd admin && npm install --no-audit --no-fund)
          (cd "Maternal Mind Website" && npm install --no-audit --no-fund)

      - name: Build Unified Single-Slot App
        run: npm run build

      - name: Deploy Built Artifacts via SCP to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          target: "domains/maternalmind.com.pk/public_html"
          rm: false
          timeout: 30m
          command_timeout: 15m
          source: "server_dist,website_dist,admin_dist,web_dist,uploads,scripts,package.json,package-lock.json,app.json,server/templates"

      - name: Trigger Hostinger Restart & Verify End-to-End via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd ~/domains/maternalmind.com.pk/public_html || cd ~/public_html || cd ~
            chmod +x scripts/deploy_hostinger.sh
            bash scripts/deploy_hostinger.sh
