name: Deploy to Hostinger (Single Slot)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          (cd admin && npm install --no-audit --no-fund)
          (cd "Maternal Mind Website" && npm install --no-audit --no-fund)

      - name: Build Unified Single-Slot App
        run: npm run build

      - name: Deploy Built Artifacts via SCP to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          target: "domains/maternalmind.com.pk/public_html"
          rm: false
          timeout: 30m
          command_timeout: 15m
          source: "server_dist,website_dist,admin_dist,web_dist,uploads,scripts/maternal_mind_mysql.sql,package.json,package-lock.json,app.js,app.json,server/templates"

      - name: Trigger Hostinger Restart & Verify End-to-End via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "Connected to Hostinger via GitHub Actions!"
            cd ~/domains/maternalmind.com.pk/public_html || cd ~/public_html || cd ~

            cat << 'EOF' > .env
            NODE_ENV=production
            DATABASE_URL=mysql://u776151780_mmuser:y!&rxCgt*4H@127.0.0.1:3306/u776151780_maternalmind
            SESSION_SECRET=64H28SmybRTDp7iqXuv3UVJ1hsrt9KMxYZ5kNzLBWOlwcjno0CQgeIAfaPdEFG
            ALLOWED_ORIGIN=https://maternalmind.com.pk
            EOF

            if [ -f "scripts/maternal_mind_mysql.sql" ]; then
              echo "Importing production database dump into Hostinger MySQL..."
              mysql -u u776151780_mmuser -p'y!&rxCgt*4H' u776151780_maternalmind < scripts/maternal_mind_mysql.sql 2>/dev/null || true
            fi

            echo "Server dist is fully self-contained standalone bundle."

            mkdir -p tmp
            touch tmp/restart.txt
            echo "=============================================="
            echo "HOSTINGER DEPLOYMENT VERIFIED & ACTIVATED!"
            echo "=============================================="
